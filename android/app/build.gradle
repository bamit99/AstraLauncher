plugins { id 'com.android.application' }

android {
    namespace 'com.astra.launcher'
    compileSdk 34

    defaultConfig {
        applicationId "com.astra.launcher"
        minSdk 21
        targetSdk 34
        versionCode 3
        versionName "1.3"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
